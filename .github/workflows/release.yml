# Builds an installable zip and publishes a GitHub Release whenever a version tag (v*) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match manifest version $VER" >&2
            exit 1
          fi

      - name: Build zip
        run: bash scripts/build.sh

      - name: Extract release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Power Link $VER" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Power Link ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/power-link-${{ github.ref_name }}.zip
