<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>정렬 견본</title>
<link rel="stylesheet" href="../src/ui/pl.css">
<style>body{margin:0;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start} .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head>
<body class="pl-app">
<!-- tests/align-pages.mjs 가 재는 견본: 버튼·칩·구간 선택·태그·메뉴 항목의 모든 크기 -->
<div class="r"><button class="pl-btn">기본 버튼</button><button class="pl-btn pl-btn--ink">저장하기</button><button class="pl-btn pl-btn--outline">테두리 버튼</button><button class="pl-btn pl-btn--ghost">취소</button></div>
<div class="r"><button class="pl-btn pl-btn--sm">작은 버튼</button><button class="pl-btn pl-btn--sm pl-btn--ink">연결 확인</button><button class="pl-btn pl-btn--sm pl-btn--outline">다시 시도</button></div>
<div class="r"><button class="pl-btn pl-btn--lg">큰 버튼</button><button class="pl-btn pl-btn--lg pl-btn--ink">규칙 추가</button><button class="pl-btn pl-btn--xl pl-btn--ink">아주 큰 버튼</button><button class="pl-btn pl-btn--xl pl-btn--outline">영상 다운로드</button></div>
<div class="r"><button class="pl-chip">전체</button><button class="pl-chip" aria-pressed="true">유튜브</button><button class="pl-chip pl-chip--muted">틱톡</button><button class="pl-chip pl-chip--sm">작은 칩</button><button class="pl-chip pl-chip--sm" aria-pressed="true">선택됨</button></div>
<div class="r"><div class="pl-seg"><button class="pl-seg__item" aria-pressed="true">썸네일</button><button class="pl-seg__item">목록</button><button class="pl-seg__item">상세</button></div>
  <div class="pl-seg pl-seg--lg"><button class="pl-seg__item" aria-pressed="true">밝게</button><button class="pl-seg__item">어둡게</button><button class="pl-seg__item">자동</button></div></div>
<div class="r" style="width:360px"><div class="pl-seg pl-seg--fill"><button class="pl-seg__item" aria-pressed="true">영상+음성</button><button class="pl-seg__item">영상만</button><button class="pl-seg__item">음성만</button></div></div>
<div class="r"><span class="pl-tag">여행</span><span class="pl-tag">인물</span></div>
<div class="r" style="flex-direction:column;align-items:stretch;width:240px"><button class="pl-nav__item">수집 규칙</button><button class="pl-nav__item" aria-current="page">영상 다운로드</button></div>
</body></html>
