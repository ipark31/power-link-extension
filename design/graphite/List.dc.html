<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수집 링크 · 목록과 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, 'Noto Sans KR', Arial, sans-serif; font-size: 13px; overflow: hidden; position: relative">

  <div style="height: 48px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-bottom: 1px solid {{t.border}}">
    <svg width="22" height="22" viewBox="0 0 128 128" role="img" aria-label="Power Link 로고"><rect width="128" height="128" rx="30" fill="#111317"></rect><rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"></rect><g transform="translate(64 64) scale(1.2) translate(-64 -64)"><g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M28 48V34a6 6 0 0 1 6-6h14"></path><path d="M80 28h14a6 6 0 0 1 6 6v14"></path><path d="M28 80v14a6 6 0 0 0 6 6h14"></path></g><path d="M62 60l38 14-16 5 11 17-8 5-11-17-11 12z" fill="#4CFF3F" stroke="#4CFF3F" stroke-width="4" stroke-linejoin="round"></path></g></svg>
    <span style="font-size: 15px; font-weight: 500">Power Link</span>
    <span style="font-size: 12px; color: {{t.muted}}">v2.1.3</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center">
      <button type="button" aria-label="현재 창의 링크 모으기" title="현재 창의 링크 모으기" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: {{t.text2}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7M18 14v7M14.5 17.5h7"></path></svg></button>
      <button type="button" aria-label="테마 전환" title="테마 전환" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: {{t.text2}}; display: grid; place-items: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg></button>
      <button type="button" aria-label="설정" title="설정" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: {{t.text2}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></button>
      <span aria-hidden="true" style="width: 1px; height: 16px; margin: 0 4px; background: {{t.border}}"></span>
      <button type="button" aria-label="사이드 패널 닫기" title="사이드 패널 닫기" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: {{t.text2}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
  </div>

  <div style="height: 48px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: stretch; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid {{t.border}}">
    <button type="button" style="border: none; outline: 0; border-radius: 0; background:{{t.chip}}; padding: 0 10px; display: flex; align-items: center; gap: 5px; font-family: inherit; font-size: 13px; font-weight: 500; color: {{t.text}}; border-bottom: 2px solid {{t.text}}; cursor: pointer">수집 링크<span style="font-size: 11px; font-weight: 400; color: {{t.muted}}">10</span></button>
    <button type="button" style="border: none; border-bottom: 2px solid transparent; outline: 0; border-radius: 0; background: none; padding: 0 10px; display: flex; align-items: center; font-family: inherit; font-size: 13px; font-weight: 500; color: {{t.muted}}; cursor: pointer">최근 화면</button>
    <button type="button" style="border: none; border-bottom: 2px solid transparent; outline: 0; border-radius: 0; background: none; padding: 0 10px; display: flex; align-items: center; font-family: inherit; font-size: 13px; font-weight: 500; color: {{t.muted}}; cursor: pointer">키워드</button>
    <button type="button" style="border: none; border-bottom: 2px solid transparent; outline: 0; border-radius: 0; background: none; padding: 0 10px; display: flex; align-items: center; gap: 5px; font-family: inherit; font-size: 13px; font-weight: 500; color: {{t.muted}}; cursor: pointer">워치리스트<span style="font-size: 11px; font-weight: 400">8</span></button>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 10px; border-bottom: 1px solid {{t.divider}}">
    <label style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid {{t.border}}; border-radius: 18px; background: {{t.input}}; color: {{t.muted}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input type="text" aria-label="검색" placeholder="제목, 채널, 메모 검색" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 13px; color: {{t.text}}">
    </label>
    <div style="display: flex; align-items: center; gap: 6px">
      <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: {{t.ink}}; color: {{t.onInk}}; font-family: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">전체<span style="font-weight: 400; opacity: .7">10</span></button>
      <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: {{t.chip}}; color: {{t.text}}; font-family: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="5" width="19" height="14" rx="4"></rect><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor"></path></svg>유튜브<span style="font-weight: 400; color: {{t.muted}}">10</span></button>
      <div style="flex-grow: 1"></div>
      <button type="button" style="height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: {{t.text2}}; font-family: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px; cursor: pointer">종류<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" style="height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: {{t.text2}}; font-family: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px; cursor: pointer">카테고리<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <input type="checkbox" aria-label="전체 선택" style="width: 15px; height: 15px; margin: 0; accent-color: {{t.ink}}">
      <span style="font-size: 12px; color: {{t.muted}}">10개 표시</span>
      <button type="button" style="height: 26px; padding: 0 4px; border: 0; background: none; color: {{t.text2}}; font-family: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px; cursor: pointer">최근 수집순<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <div style="flex-grow: 1"></div>
      <div role="group" aria-label="보기 방법" style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: {{t.seg}}">
        <button type="button" aria-label="목록" aria-pressed="true" style="width: 30px; height: 24px; border: 0; border-radius: 6px; background: {{t.segOn}}; color: {{t.text}}; box-shadow: {{t.segShadow}}; display: grid; place-items: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"></path></svg></button>
        <button type="button" aria-label="상세" style="width: 30px; height: 24px; border: 0; border-radius: 6px; background: none; color: {{t.muted}}; display: grid; place-items: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="6" rx="1.5"></rect><path d="M4 15h16M4 19h10"></path></svg></button>
        <button type="button" aria-label="썸네일" style="width: 30px; height: 24px; border: 0; border-radius: 6px; background: none; color: {{t.muted}}; display: grid; place-items: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></button>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-bottom: 1px solid {{t.divider}}; background: {{r.rowBg}}">
        <input type="checkbox" aria-label="선택" checked="{{r.sel}}" readOnly="{{r.yes}}" style="width: 15px; height: 15px; margin: 13px 0 0; flex-shrink: 0; accent-color: {{t.ink}}">
        <div style="position: relative; width: 76px; height: 43px; flex-shrink: 0; border-radius: 8px; background: {{r.thumbBg}}; display: grid; place-items: center">
          <sc-if value="{{r.isChannel}}" hint-placeholder-val="{{false}}">
            <div style="width: 34px; height: 34px; border-radius: 50%; background: #3A3F47; color: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 500">{{r.initial}}</div>
          </sc-if>
          <sc-if value="{{r.isVideo}}" hint-placeholder-val="{{true}}">
            <span style="position: absolute; right: 3px; bottom: 3px; padding: 0 3px; border-radius: 3px; background: rgba(0,0,0,.8); color: #FFFFFF; font-size: 10px; font-weight: 500; line-height: 14px">{{r.dur}}</span>
          </sc-if>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <a href="#" style="text-decoration: none; color: {{t.text}}; font-size: 13px; font-weight: 500; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><svg width="16" height="11" viewBox="0 0 28 20" role="img" aria-label="유튜브" style="vertical-align: -1px; margin-right: 5px"><rect width="28" height="20" rx="5" fill="#FF0000"></rect><path d="M11 6l7.5 4-7.5 4z" fill="#FFFFFF"></path></svg>{{r.title}}</a>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.muted}}; min-width: 0"><span aria-hidden="true" style="width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%; background: {{r.av}}; color: #FFFFFF; font-size: 9px; font-weight: 500; display: grid; place-items: center">{{r.avText}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span><sc-if value="{{r.hot}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-weight: 500; color: {{t.up}}">×{{r.outlier}}</span></sc-if></span>
          <sc-if value="{{r.hasMemo}}" hint-placeholder-val="{{false}}">
            <span style="margin-top: 3px; align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: {{t.chip}}; font-size: 12px; color: {{t.text2}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h14v11l-5 5H5z"></path><path d="M14 20v-5h5"></path></svg>{{r.memo}}</span>
          </sc-if>
        </div>
        <button type="button" aria-label="메모" style="flex-shrink: 0; width: 28px; height: 28px; margin-top: 6px; border: 0; border-radius: 14px; background: none; color: {{t.muted}}; display: grid; place-items: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h14v11l-5 5H5z"></path><path d="M14 20v-5h5M8 9h8M8 13h5"></path></svg></button>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 48px; box-sizing: border-box; padding: 0 6px 0 14px; border-radius: 12px; background: {{t.bar}}; color: {{t.barText}}; display: flex; align-items: center; box-shadow: 0 12px 28px -10px rgba(0,0,0,.45); border: 1px solid {{t.barBorder}}">
    <span style="font-size: 13px; font-weight: 500">2개 선택</span>
    <div style="flex-grow: 1"></div>
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="7">
      <button type="button" aria-label="{{a.label}}" title="{{a.label}}" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: none; color: {{t.barIcon}}; display: grid; place-items: center; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg>
      </button>
    </sc-for>
    <div style="width: 1px; height: 20px; margin: 0 3px; background: {{t.barSep}}"></div>
    <button type="button" aria-label="선택 해제" title="선택 해제" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: none; color: {{t.barIcon}}; display: grid; place-items: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#FFFFFF', input: '#F8F8F8', border: '#E5E5E5', divider: '#F0F0F0', text: '#0F0F0F', text2: '#3F3F3F', muted: '#606060', ink: '#0F0F0F', onInk: '#FFFFFF', chip: '#F2F2F2', seg: '#F2F2F2', segOn: '#FFFFFF', segShadow: '0 1px 2px rgba(0,0,0,.14)', up: '#0B7A3B', sel: '#F2F2F2', thumbCh: '#F2F2F2', bar: '#0F0F0F', barText: '#FFFFFF', barIcon: '#D6D6D6', barBorder: '#0F0F0F', barSep: '#3A3A3A' },
      dark: { bg: '#0F0F0F', input: '#121212', border: '#303030', divider: '#222222', text: '#F1F1F1', text2: '#D0D0D0', muted: '#AAAAAA', ink: '#F1F1F1', onInk: '#0F0F0F', chip: '#272727', seg: '#272727', segOn: '#474747', segShadow: 'none', up: '#4ADE80', sel: '#1F1F1F', thumbCh: '#1F1F1F', bar: '#272727', barText: '#F1F1F1', barIcon: '#D6D6D6', barBorder: '#3A3A3A', barSep: '#474747' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const AV = ['#8B6F4E', '#4E6A8B', '#5E7D62', '#7A5C86', '#8B4E55', '#4E7F86'];
    const avOf = (name) => AV[[...name].reduce((n, ch) => n + ch.charCodeAt(0), 0) % AV.length];
    const row = (title, meta, dur, outlier, bg, sel, memo) => ({
      isVideo: true, isChannel: false, title, meta, dur, outlier, hot: outlier >= 1.5, thumbBg: bg, sel: !!sel, yes: true,
      av: avOf(meta.split(' · ')[0]), avText: meta.trim()[0],
      memo: memo || '', hasMemo: !!memo, rowBg: sel ? t.sel : t.bg
    });
    return {
      t,
      rows: [
        row('[충격단독] 장사의신 은현장이 집 산다니까 75억짜리를 100억에 내놨네?', '장사의 신 · 조회 12만 · 3일 전', '12:04', 0.6, '#2E3238', true, '부동산 썸네일 구도 참고'),
        row('사진은 기세다 ㅋㅋㅋ | KBS 방송', 'KBS COMEDY · 조회 3.1만 · 1주 전', '14:21', 0.2, '#3A3834', false),
        row('전세계 유일하게 한글을 공용문자로 쓰는 해외도시 입국기', '상가의 안녕히살아보기 · 조회 48만 · 5일 전', '42:18', 2.1, '#31363B', true),
        row('유시민 끔찍한 예언 적중! "지지층이 000 할 수도".. 추석 밥상', '언론 알아야 바꾼다 · 조회 9.4만 · 2일 전', '8:02', 0.3, '#262A30', false),
        { isVideo: false, isChannel: true, initial: '언', title: '언론 알아야 바꾼다', meta: '언론 알아야 바꾼다 · 구독자 21만 · 영상 1,204', av: avOf('언론 알아야 바꾼다'), avText: '언', hot: false, thumbBg: t.thumbCh, sel: false, yes: true, hasMemo: false, rowBg: t.bg },
        row('12% 코에는 빠진다? 수도권 전체 예약한 민주당 내부의 충격적 판단', '언론 알아야 바꾼다 · 조회 6.2만 · 어제', '10:37', 1.4, '#34302E', false),
        row('편의점 알바가 본 진상 손님 유형 TOP 5', '알바몬 스토리 · 조회 21만 · 4일 전', '0:58', 3.4, '#2D3136', false),
        row('옛날 옛적 한양에 소문난 구두쇠가 살았는데', '밤마다 야담 · 조회 7.7만 · 6일 전', '1:02:44', 1.1, '#3B3530', false, '도입 훅 좋음')
      ],
      actions: [
        { label: '복사', d: 'M8 8h12v12H8zM16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2' },
        { label: '새 탭으로 열기', d: 'M14 4h6v6M20 4 10 14M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4' },
        { label: '썸네일 압축 저장', d: 'M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 15l5-5 4 4 3-3 6 6' },
        { label: '워치리스트에 추가', d: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6' },
        { label: '북마크에 추가', d: 'M6 4h12v17l-6-4-6 4V4Z' },
        { label: '엑셀 다운로드', d: 'M12 4v11M7 10l5 5 5-5M5 20h14' },
        { label: '목록에서 삭제', d: 'M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3' }
      ]
    };
  }
}
</script>
</body>
</html>
